<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt món thành công | Resort Deluxe</title>

  <!-- Google Fonts: Playfair Display + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/page-transition.css">
  <link rel="stylesheet" href="css/navbar-auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============================================
       TANDJUNG SARI LIGHT LUXURY CSS
       ============================================ */
    body {
      background-color: var(--bg-light, #f4f0e6) !important;
      color: var(--text-main, #333333) !important;
      font-family: 'Inter', sans-serif;
    }

    .success-wrapper {
      padding: 100px 5%;
      max-width: 900px;
      margin: 0 auto;
    }

    .success-hero-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      margin-bottom: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .success-header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .success-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 4vw, 56px);
      color: var(--ts-dark, #111);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .success-header p {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-muted, #777);
      text-transform: uppercase;
    }

    .success-icon-main {
      font-size: 60px;
      color: var(--ts-gold, #8a2017);
      margin-bottom: 20px;
    }

    /* Card Details */
    .taste-glass-panel {
      background: #fff;
      padding: 50px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-light, #e0dcd0);
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--ts-dark, #111);
      margin-bottom: 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-light, #e0dcd0);
      padding-bottom: 20px;
    }

    /* Re-style injected JS classes */
    .detail-row {
      display: flex;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-light, #e0dcd0);
      gap: 20px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-icon {
      width: 50px;
      height: 50px;
      background: var(--bg-surface, #ebe5d8);
      color: var(--ts-gold, #8a2017);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .detail-content {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .detail-label {
      color: var(--text-muted, #777);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .detail-value {
      color: var(--ts-dark, #111);
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      text-align: right;
      font-weight: 500;
    }

    .detail-value.amount {
      color: var(--ts-gold, #8a2017);
      font-size: 28px;
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .taste-btn {
      border: 1px solid var(--border-light, #e0dcd0);
      background: transparent;
      color: var(--ts-dark, #111);
      padding: 12px 30px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .taste-btn:hover {
      border-color: var(--ts-gold, #8a2017);
      color: var(--ts-gold, #8a2017);
    }

    .taste-btn-primary {
      border: 1px solid var(--ts-gold, #8a2017);
      background: var(--ts-gold, #8a2017);
      color: #fff;
    }

    .taste-btn-primary:hover {
      background: #a03830;
      border-color: #a03830;
      color: #fff;
    }

    .order-items-box {
      background: var(--bg-surface, #ebe5d8);
      padding: 20px;
      margin-top: 10px;
      border-left: 3px solid var(--ts-gold, #8a2017);
      width: 100%;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-item-name {
      font-weight: 600;
      color: var(--ts-dark, #111);
      font-size: 15px;
    }

    .order-item-qty {
      color: var(--text-muted, #777);
      font-size: 14px;
      margin-left: 10px;
    }

    .order-item-price {
      color: var(--ts-gold, #8a2017);
      font-weight: 700;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .success-wrapper {
        padding: 60px 5%;
      }

      .taste-glass-panel {
        padding: 30px 20px;
      }

      .detail-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .detail-value {
        text-align: left;
      }
    }
  </style>
</head>

<body class="layout-vertical">
  <!-- Navbar -->
  <header id="site-header"></header>

  <!-- Core Scripts -->
  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="js/navbar-auth.js"></script>

  <!-- Main Content wrapped for PJAX -->
  <main id="page-content" data-page="order-success" data-layout="vertical">
    <div class="success-wrapper">

      <div class="success-header">
        <div class="success-icon-main"><i class="fas fa-check-circle"></i></div>
        <h1>Đặt món thành công!</h1>
        <p>Chúng tôi đã ghi nhận đơn đặt món của bạn</p>
      </div>

      <div class="taste-glass-panel">
        <h3 class="panel-title">Thông tin đơn hàng</h3>

        <div id="orderDetails">
          <div class="text-center py-5">
            <div class="spinner-border" role="status" style="width:3rem;height:3rem;border-width:2px;color:#8a2017">
              <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-4" style="font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#777">Đang tải
              thông tin...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    function formatCurrency(amount) {
      try {
        return new Intl.NumberFormat('vi-VN', {
          style: 'currency',
          currency: 'VND',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(amount || 0);
      } catch (_) {
        return (amount || 0).toLocaleString('vi-VN') + ' ₫';
      }
    }

    async function loadOrderDetails() {
      if (!orderId) {
        document.getElementById('orderDetails').innerHTML = `
          <div style="text-align:center; padding: 40px 0; color: #8a2017;">
            <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px">⚠️ Không tìm thấy mã đơn hàng</h5>
            <p style="font-size:15px; color:#777">Vui lòng kiểm tra lại hoặc liên hệ: <strong>+84 901 329 227</strong></p>
          </div>
        `;
        return;
      }

      try {
        const token = localStorage.getItem('token');
        if (!token) {
          document.getElementById('orderDetails').innerHTML = `
            <div style="text-align:center; padding: 40px 0;">
              <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px">Vui lòng đăng nhập</h5>
              <p style="font-size:15px; color:#777">Để xem chi tiết đơn hàng, vui lòng <a href="login.html" style="color:#8a2017">đăng nhập</a>.</p>
            </div>
          `;
          return;
        }

        const API_ORDER = `${location.origin}/api/restaurant-orders/${orderId}?_=${Date.now()}`;
        const resp = await fetch(API_ORDER, {
          headers: {
            'Authorization': `Bearer ${token}`
          },
          cache: 'no-store'
        });

        if (!resp.ok) {
          throw new Error('Không thể tải thông tin đơn hàng');
        }

        const order = await resp.json();
        renderOrderDetails(order);
      } catch (e) {
        console.error('Error loading order:', e);
        document.getElementById('orderDetails').innerHTML = `
          <div style="text-align:center; padding: 40px 0;">
            <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px; color:#16a34a">✅ Đơn hàng đã được ghi nhận</h5>
            <p style="margin-bottom:10px">Mã đơn hàng: <strong>${orderId}</strong></p>
            <p style="font-size:15px; color:#777">Chúng tôi sẽ liên hệ với bạn trong thời gian sớm nhất.</p>
          </div>
        `;
      }
    }

    async function renderOrderDetails(order) {
      const orderDate = new Date(order.createdAt || order.orderDate).toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const orderNumber = order.orderNumber || `ORD${orderId}`;
      const deliveryTime = order.deliveryTime ? new Date(order.deliveryTime).toLocaleString('vi-VN') : '-';
      const deliveryAddress = order.deliveryAddress || '-';

      let orderItemsHtml = '';
      if (order.orderItems && order.orderItems.length > 0) {
        orderItemsHtml = order.orderItems.map(item => {
          const itemName = item.service?.serviceName || item.serviceName || 'N/A';
          const quantity = item.quantity || 0;
          const unitPrice = item.unitPrice || item.price || 0;
          const subtotal = quantity * unitPrice;
          return `
            <div class="order-item">
              <div>
                <span class="order-item-name">${itemName}</span>
                <span class="order-item-qty">x${quantity}</span>
              </div>
              <span class="order-item-price">${formatCurrency(subtotal)}</span>
            </div>
          `;
        }).join('');
      } else {
        orderItemsHtml = '<p style="color:#777;margin:0">Không có món nào trong đơn hàng</p>';
      }

      document.getElementById('orderDetails').innerHTML = `
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-receipt"></i></div>
          <div class="detail-content">
            <span class="detail-label">Mã đơn hàng</span>
            <span class="detail-value">${orderNumber}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-info-circle"></i></div>
          <div class="detail-content">
            <span class="detail-label">Trạng thái</span>
            <span class="detail-value" style="color:#8a2017">${getStatusText(order.status)}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-credit-card"></i></div>
          <div class="detail-content">
            <span class="detail-label">Thanh toán</span>
            <span class="detail-value" style="color:#16a34a">${getPaymentStatusText(order.paymentStatus)}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-calendar-alt"></i></div>
          <div class="detail-content">
            <span class="detail-label">Ngày đặt</span>
            <span class="detail-value">${orderDate}</span>
          </div>
        </div>
        ${deliveryTime !== '-' ? `
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-clock"></i></div>
          <div class="detail-content">
            <span class="detail-label">Thời gian giao</span>
            <span class="detail-value">${deliveryTime}</span>
          </div>
        </div>
        ` : ''}
        ${deliveryAddress !== '-' ? `
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-map-marker-alt"></i></div>
          <div class="detail-content">
            <span class="detail-label">Địa chỉ giao hàng</span>
            <span class="detail-value" style="text-align:right;max-width:60%">${deliveryAddress}</span>
          </div>
        </div>
        ` : ''}
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-coins"></i></div>
          <div class="detail-content">
            <span class="detail-label">Tổng tiền</span>
            <span class="detail-value amount">${formatCurrency(order.totalAmount || 0)}</span>
          </div>
        </div>
        <div class="detail-row" style="flex-direction:column;align-items:flex-start;border-bottom:none">
          <div style="display:flex;align-items:center;gap:20px;width:100%;margin-bottom:15px">
            <div class="detail-icon"><i class="fas fa-utensils"></i></div>
            <span class="detail-label" style="margin-top:10px">Danh sách món ăn</span>
          </div>
          <div class="order-items-box">
            ${orderItemsHtml}
          </div>
        </div>
        <div class="action-buttons" id="dynActionButtons"></div>
      `;

      const actionButtons = document.getElementById('dynActionButtons');
      if (orderId && actionButtons) {
        actionButtons.innerHTML = `
          <a href="order-details.html?orderId=${orderId}" class="taste-btn taste-btn-primary">
            <i class="fas fa-eye"></i> Xem chi tiết
          </a>
          <a href="my-restaurant-orders.html" class="taste-btn">
            <i class="fas fa-list"></i> Đơn hàng của tôi
          </a>
          <a href="index.html" class="taste-btn">
            <i class="fas fa-home"></i> Về trang chủ
          </a>
        `;
      }
    }

    function getStatusText(status) {
      const texts = {
        'Pending': 'Chờ xác nhận',
        'Confirmed': 'Đã xác nhận',
        'Preparing': 'Đang chuẩn bị',
        'Ready': 'Sẵn sàng',
        'Delivered': 'Đã giao',
        'Cancelled': 'Đã hủy'
      };
      return texts[status] || status;
    }

    function getPaymentStatusText(paymentStatus) {
      const texts = {
        'Unpaid': 'Chưa thanh toán',
        'Paid': 'Đã thanh toán',
        'Refunded': 'Đã hoàn tiền'
      };
      return texts[paymentStatus] || paymentStatus;
    }

    document.addEventListener('DOMContentLoaded', loadOrderDetails);
    document.addEventListener('pjax:complete', function () {
      if (document.getElementById('orderDetails')) {
        loadOrderDetails();
      }
    });

    // Global initial load for sidebar (only runs on direct page access)
    document.addEventListener('DOMContentLoaded', async () => {
      if (document.getElementById('site-header') && !document.querySelector('#site-header .ts-sidebar')) {
        try {
          const res = await fetch(`components/header.html?_=${Date.now()}`);
          if (res.ok) document.getElementById('site-header').innerHTML = await res.text();
        } catch (e) { console.error('Error loading header', e); }
      }
    });
  </script>

  <script src="js/page-loader.js"></script>
</body>

</html>
