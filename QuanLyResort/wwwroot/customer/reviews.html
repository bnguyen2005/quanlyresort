<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery & Guest Book | Resort Luxury</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tandjung-theme.css?v=84">

  <style>
    /* CSS for layout-reviews is now in tandjung-theme.css */
  </style>
</head>

<body class="layout-reviews">
  <header id="site-header"></header>

  <main id="page-content" data-page="reviews" data-layout="vertical">

    <!-- The Topbar EXACTLY like screenshot -->
    <div class="gallery-topbar">
      <nav class="gallery-tabs">
        <a href="#" class="active" data-filter="all">Tất cả</a>
        <a href="#" data-filter="bungalows">Phòng</a>
        <a href="#" data-filter="dining">Nhà Hàng</a>
        <a href="#" data-filter="comment">Nhận xét của khách hàng</a>
      </nav>
    </div>

    <div class="gallery-wrapper">

      <!-- Write a review panel (conditionally shown) -->
      <div class="gb-write-panel" id="gbWritePanel">
        <h2 style="font-family: 'Caveat', cursive; text-align: center; margin-bottom: 20px;">✍️ Share Your Experience
        </h2>
        <div style="display:flex; gap:15px; margin-bottom:15px;">
          <input type="text" id="gbName" placeholder="Your Name"
            style="flex:1; padding:10px; border:1px solid #ccc; font-family:'Caveat', cursive; font-size:18px;">
          <input type="text" id="gbOrigin" placeholder="Where are you from?"
            style="flex:1; padding:10px; border:1px solid #ccc; font-family:'Caveat', cursive; font-size:18px;">
        </div>
        <textarea id="gbMessage" placeholder="Write your thoughts..."
          style="width:100%; height:100px; padding:10px; border:1px solid #ccc; font-family:'Caveat', cursive; font-size:18px; margin-bottom:15px;"></textarea>
        <button id="gbSubmitBtn"
          style="background:#b39b7d; color:#fff; border:none; padding:10px 20px; font-family:'Caveat', cursive; font-size:18px; cursor:pointer;">Sign
          the Book</button>
      </div>

      <!-- Masonry Container -->
      <div class="gallery-masonry" id="galleryMasonry"></div>

    </div>

    <script>
      (function () {
        document.body.classList.add('layout-reviews');

        var currentFilter = 'all';

        // Mock Image Data
        var IMAGES = [
          // BUNGALOWS / ROOMS
          { type: 'bungalows', src: 'images/room-1.jpg' },
          { type: 'bungalows', src: 'images/room-2.jpg' },
          { type: 'bungalows', src: 'images/room-3.jpg' },
          { type: 'bungalows', src: 'images/room-4.jpg' },
          { type: 'bungalows', src: 'images/room-5.jpg' },
          { type: 'bungalows', src: 'images/room-6.jpg' },
          { type: 'bungalows', src: 'images/roommain.jpg' },
          { type: 'bungalows', src: 'images/roomnormal.jpg' },
          { type: 'bungalows', src: 'images/roomnormaldetail.jpg' },
          { type: 'bungalows', src: 'images/roomnormaldetail1.jpg' },
          { type: 'bungalows', src: 'images/roomnormaldetail2.jpg' },
          { type: 'bungalows', src: 'images/roomstory.png' },
          { type: 'bungalows', src: 'images/roomstory2.png' },
          { type: 'bungalows', src: 'images/roomstory3.png' },
          { type: 'bungalows', src: 'images/image_1.jpg' },
          { type: 'bungalows', src: 'images/image_4.jpg' },
          { type: 'bungalows', src: 'images/image_5.jpg' },
          { type: 'bungalows', src: 'images/image_6.jpg' },
          { type: 'bungalows', src: 'images/image_7.jpg' },
          { type: 'bungalows', src: 'images/insta-1.jpg' },
          { type: 'bungalows', src: 'images/insta-3.jpg' },
          { type: 'bungalows', src: 'images/insta-5.jpg' },
          { type: 'bungalows', src: 'images/story1.jpg' },

          // DINING / RESTAURANT
          { type: 'dining', src: 'images/menu-1.jpg' },
          { type: 'dining', src: 'images/menu-2.jpg' },
          { type: 'dining', src: 'images/menu-3.jpg' },
          { type: 'dining', src: 'images/menu-4.jpg' },
          { type: 'dining', src: 'images/menu-5.jpg' },
          { type: 'dining', src: 'images/menu-6.jpg' },
          { type: 'dining', src: 'images/menu-7.jpg' },
          { type: 'dining', src: 'images/menu-8.jpg' },
          { type: 'dining', src: 'images/food.png' },
          { type: 'dining', src: 'images/food1.png' },
          { type: 'dining', src: 'images/image_2.jpg' },
          { type: 'dining', src: 'images/image_3.jpg' },
          { type: 'dining', src: 'images/image_8.jpg' },
          { type: 'dining', src: 'images/insta-2.jpg' },
          { type: 'dining', src: 'images/insta-4.jpg' },
          { type: 'dining', src: 'images/restaurantmain.jpg' },
          { type: 'dining', src: 'images/restaurantstory.jpg' },
          { type: 'dining', src: 'images/restaurantstory2.jpg' },
          { type: 'dining', src: 'images/restaurantstory3.jpg' },
          { type: 'dining', src: 'images/restaurantstory4.jpg' }
        ];

        // Mock Note Data
        var NOTES = [
          { guestName: 'James & Mary Wilson', origin: 'Sydney, Australia', comment: 'Tandjung Sari lives up to its rare reputation. This place is as if time stood still — beautifully curated and wonderfully intimate.', date: '2025-11-20' },
          { guestName: 'Nguyen Thi Lan', origin: 'Ha Noi, Viet Nam', comment: 'Phong bungalow tuyet voi! Khong gian yen tinh, thien nhien xanh mat. Chung toi se quay lai vao nam toi.', date: '2025-12-15' },
          { guestName: 'Sophie Laurent', origin: 'Paris, France', comment: 'Un endroit hors du temps. Le bungalow donnait sur le jardin tropical — un reve! Le personnel est aux petits soins.', date: '2025-09-30' },
          { guestName: 'Michael Chen', origin: 'Singapore', comment: 'The seafood feast was extraordinary. Every dish was prepared with care and presented beautifully.', date: '2025-08-22' },
          { guestName: 'Emma & Tom Baker', origin: 'London, UK', comment: 'We came in search for peace... we found it! We came in search for rest... we found it! Best of friends, sharing best of times!', date: '2025-07-28' },
          { guestName: 'Akira Tanaka', origin: 'Tokyo, Japan', comment: 'Shizuka de utsukushii basho desu. Staff wa totemo yasashikute, ryokan no yo na moteNASHI.', date: '2025-06-20' },
        ];

        // Combine into one array and shuffle/mix for 'all'
        var MIXED_ITEMS = [];
        var i = 0, n = 0;
        while (i < IMAGES.length || n < NOTES.length) {
          if (i < IMAGES.length) {
            MIXED_ITEMS.push({ kind: 'image', data: IMAGES[i] });
            i++;
          }
          if (i < IMAGES.length && Math.random() > 0.5) {
            MIXED_ITEMS.push({ kind: 'image', data: IMAGES[i] });
            i++;
          }
          if (n < NOTES.length) {
            MIXED_ITEMS.push({ kind: 'note', data: NOTES[n] });
            n++;
          }
        }

        var masonry = document.getElementById('galleryMasonry');
        var writePanel = document.getElementById('gbWritePanel');

        function renderItem(item) {
          if (item.kind === 'image') {
            return '<div class="gallery-item"><img src="' + item.data.src + '" class="gallery-img" alt="Gallery Image"></div>';
          } else {
            return '<div class="gallery-item gb-note">'
              + '<div class="gb-note-date">' + item.data.date + '</div>'
              + '<p class="gb-note-text">' + item.data.comment + '</p>'
              + '<div class="gb-note-sig">' + item.data.guestName + '<br><span style="font-size:13px; opacity:0.6;">' + item.data.origin + '</span></div>'
              + '</div>';
          }
        }

        function renderGrid(filter) {
          var itemsToRender = [];

          if (filter === 'all') {
            itemsToRender = MIXED_ITEMS;
            writePanel.style.display = 'none';
          } else if (filter === 'comment') {
            itemsToRender = NOTES.map(function (n) { return { kind: 'note', data: n }; });
            writePanel.style.display = 'block'; // Show write panel on guest comment tab
          } else {
            // bungalows or dining
            itemsToRender = IMAGES.filter(function (img) { return img.type === filter; })
              .map(function (img) { return { kind: 'image', data: img }; });
            writePanel.style.display = 'none';
          }

          masonry.innerHTML = itemsToRender.map(renderItem).join('');

          // Animate reveal
          requestAnimationFrame(function () {
            var els = masonry.querySelectorAll('.gallery-item');
            els.forEach(function (el, idx) {
              setTimeout(function () { el.classList.add('revealed'); }, idx * 50);
            });
          });
        }

        // Setup Tabs
        document.querySelectorAll('.gallery-tabs a').forEach(function (tab) {
          tab.addEventListener('click', function (e) {
            e.preventDefault();
            document.querySelectorAll('.gallery-tabs a').forEach(function (t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderGrid(currentFilter);
          });
        });

        // Handle Write Review
        document.getElementById('gbSubmitBtn').addEventListener('click', function () {
          var name = document.getElementById('gbName').value;
          var msg = document.getElementById('gbMessage').value;
          if (!name || !msg) return alert('Vui long dien ten va loi nhan!');

          NOTES.unshift({
            guestName: name,
            origin: document.getElementById('gbOrigin').value || 'Khach hang',
            comment: msg,
            date: new Date().toLocaleDateString('vi-VN')
          });

          // Re-render
          document.getElementById('gbName').value = '';
          document.getElementById('gbOrigin').value = '';
          document.getElementById('gbMessage').value = '';
          alert('Cam on ban da de lai nhan xet!');
          renderGrid('comment');
        });

        // Init
        renderGrid('all');
      })();
    </script>

  </main>



  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/navbar-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      try {
        var res = await fetch('components/header.html?_=' + Date.now());
        if (res.ok) document.getElementById('site-header').innerHTML = await res.text();
      } catch (e) { }
    });
  </script>
  <script src="js/page-loader.js?v=69"></script>
  <link rel="stylesheet" href="css/page-transition.css?v=82">
</body>

</html>
