<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt phòng thành công | Resort Luxury</title>

  <!-- Google Fonts: Playfair Display + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/page-transition.css">
  <link rel="stylesheet" href="css/navbar-auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============================================
       RESORT LUXURY CSS
       ============================================ */
    body {
      background-color: var(--bg-light, #f4f0e6) !important;
      color: var(--text-main, #333333) !important;
      font-family: 'Inter', sans-serif;
    }

    .success-wrapper {
      padding: 100px 5%;
      max-width: 900px;
      margin: 0 auto;
    }

    .success-hero-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      margin-bottom: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .success-header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    .success-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 4vw, 56px);
      color: var(--ts-dark, #111);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .success-header p {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-muted, #777);
      text-transform: uppercase;
    }

    .success-icon-main {
      font-size: 60px;
      color: var(--ts-gold, #8a2017);
      margin-bottom: 20px;
    }

    /* Card Details */
    .taste-glass-panel {
      background: #fff;
      padding: 50px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-light, #e0dcd0);
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--ts-dark, #111);
      margin-bottom: 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-light, #e0dcd0);
      padding-bottom: 20px;
    }

    /* Re-style injected JS classes */
    .detail-row {
      display: flex;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-light, #e0dcd0);
      gap: 20px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-icon {
      width: 50px;
      height: 50px;
      background: var(--bg-surface, #ebe5d8);
      color: var(--ts-gold, #8a2017);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .detail-content {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .detail-label {
      color: var(--text-muted, #777);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .detail-value {
      color: var(--ts-dark, #111);
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      text-align: right;
      font-weight: 500;
    }

    .detail-value.amount {
      color: var(--ts-gold, #8a2017);
      font-size: 28px;
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .taste-btn {
      border: 1px solid var(--border-light, #e0dcd0);
      background: transparent;
      color: var(--ts-dark, #111);
      padding: 12px 30px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .taste-btn:hover {
      border-color: var(--ts-gold, #8a2017);
      color: var(--ts-gold, #8a2017);
    }

    .taste-btn-primary {
      border: 1px solid var(--ts-gold, #8a2017);
      background: var(--ts-gold, #8a2017);
      color: #fff;
    }

    .taste-btn-primary:hover {
      background: #a03830;
      border-color: #a03830;
      color: #fff;
    }

    .special-requests-box {
      background: var(--bg-surface, #ebe5d8);
      padding: 20px;
      margin-top: 10px;
      border-left: 3px solid var(--ts-gold, #8a2017);
      font-size: 14px;
      color: var(--text-main, #333);
    }

    @media (max-width: 768px) {
      .success-wrapper {
        padding: 60px 5%;
      }

      .taste-glass-panel {
        padding: 30px 20px;
      }

      .detail-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .detail-value {
        text-align: left;
      }
    }
  </style>
</head>

<body class="layout-vertical">
  <!-- Navbar -->
  <header id="site-header"></header>

  <!-- Core Scripts -->
  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="js/navbar-auth.js"></script>
  <script src="js/coupons.js"></script>

  <!-- Main Content wrapped for PJAX -->
  <main id="page-content" data-page="booking-success" data-layout="vertical">
    <div class="success-wrapper">
      <img src="images/bg_1.jpg" alt="Resort Luxury" class="success-hero-img">

      <div class="success-header">
        <div class="success-icon-main"><i class="fas fa-check-circle"></i></div>
        <h1>Đặt phòng thành công</h1>
        <p>Cảm ơn bạn đã chọn Resort Luxury</p>
      </div>

      <div class="taste-glass-panel">
        <h3 class="panel-title">Thông tin đặt phòng</h3>

        <div id="bookingDetails">
          <div class="text-center py-5">
            <div class="spinner-border" role="status" style="width:3rem;height:3rem;border-width:2px;color:#8a2017">
              <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-4" style="font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#777">Đang tải
              thông tin...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Script block exactly as originally -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('bookingId');

    async function loadRoomTypesCache() {
      try {
        const token = localStorage.getItem('token');
        if (!token) return;
        const roomTypesResp = await fetch(`${location.origin}/api/room-types?_=${Date.now()}`, {
          cache: 'no-store',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });
        if (roomTypesResp.ok) {
          window._roomTypesCache = await roomTypesResp.json();
        }
      } catch (e) { }
    }
    loadRoomTypesCache();

    function vnd(n) {
      try {
        return new Intl.NumberFormat('vi-VN', {
          style: 'currency',
          currency: 'VND',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(n || 0);
      } catch (_) {
        return (n || 0).toLocaleString('vi-VN') + ' ₫';
      }
    }

    async function loadBookingDetails() {
      if (!bookingId) {
        document.getElementById('bookingDetails').innerHTML = `
          <div style="text-align:center; padding: 40px 0; color: #8a2017;">
            <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px">⚠️ Không tìm thấy mã đặt phòng</h5>
            <p style="font-size:15px; color:#777">Vui lòng kiểm tra lại email hoặc liên hệ: <strong>+84 901 329 227</strong></p>
          </div>
        `;
        return;
      }

      try {
        const token = localStorage.getItem('token');
        if (!token) {
          document.getElementById('bookingDetails').innerHTML = `
            <div style="text-align:center; padding: 40px 0;">
              <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px">Vui lòng đăng nhập</h5>
              <p style="font-size:15px; color:#777">Để xem chi tiết đặt phòng, vui lòng <a href="login.html" style="color:#8a2017">đăng nhập</a>.</p>
            </div>
          `;
          return;
        }

        const API_BOOKINGS = `${location.origin}/api/bookings/${bookingId}?_=${Date.now()}`;
        const resp = await fetch(API_BOOKINGS, {
          headers: { 'Authorization': `Bearer ${token}` },
          cache: 'no-store'
        });

        if (!resp.ok) throw new Error('Không thể tải thông tin đặt phòng');
        const booking = await resp.json();
        renderBookingDetails(booking);
      } catch (e) {
        document.getElementById('bookingDetails').innerHTML = `
          <div style="text-align:center; padding: 40px 0;">
            <h5 style="font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:15px; color:#16a34a">✅ Đặt phòng đã được ghi nhận</h5>
            <p style="margin-bottom:10px">Mã đặt phòng: <strong>${bookingId}</strong></p>
            <p style="font-size:15px; color:#777">Chúng tôi sẽ liên hệ với bạn sớm nhất.</p>
          </div>
        `;
      }
    }

    async function renderBookingDetails(booking) {
      const checkin = new Date(booking.checkInDate).toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const checkout = new Date(booking.checkOutDate).toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const bookingCode = booking.bookingCode || `BKG${bookingId}`;
      const roomInfo = booking.room ? `${booking.room.roomNumber} - ${booking.room.roomTypeNavigation?.typeName || booking.requestedRoomType || 'N/A'}` : (booking.requestedRoomType || 'N/A');

      let baseAmount = Number(booking.estimatedTotalAmount || booking.totalAmount || 0);
      let discount = 0;
      let couponInfo = null;
      let couponCode = booking.couponCode || null;

      if (!couponCode && booking.specialRequests) {
        try {
          const parsed = JSON.parse(booking.specialRequests);
          if (typeof parsed === 'object' && parsed !== null && parsed.couponCode) {
            couponCode = parsed.couponCode;
          }
        } catch (_) { }
      }

      if (couponCode && window.coupons) {
        try {
          const coupon = await window.coupons.validateCoupon(couponCode);
          couponInfo = coupon;
          if (baseAmount <= 0 && booking.checkInDate && booking.checkOutDate) {
            const nights = Math.ceil((new Date(booking.checkOutDate) - new Date(booking.checkInDate)) / (1000 * 60 * 60 * 24));
            let roomPrice = Number(booking.room?.roomTypeNavigation?.basePrice || booking.room?.pricePerNight || booking.room?.roomTypeNavigation?.pricePerNight || 0);
            if (nights > 0 && roomPrice > 0) {
              baseAmount = nights * roomPrice;
              const backendAmount = Number(booking.estimatedTotalAmount || booking.totalAmount || 0);
              if (backendAmount > 0 && baseAmount !== backendAmount) {
                baseAmount = backendAmount;
              }
            }
          }
          if (baseAmount > 0) {
            const result = window.coupons.calculateDiscountedTotal(baseAmount, coupon);
            discount = result.discount;
          }
        } catch (e) {
          if (baseAmount <= 0 && booking.checkInDate && booking.checkOutDate) {
            const nights = Math.ceil((new Date(booking.checkOutDate) - new Date(booking.checkInDate)) / (1000 * 60 * 60 * 24));
            let roomPrice = Number(booking.room?.roomTypeNavigation?.basePrice || booking.room?.pricePerNight || booking.room?.roomTypeNavigation?.pricePerNight || 0);
            if (nights > 0 && roomPrice > 0) {
              baseAmount = nights * roomPrice;
              const finalAmount = Number(booking.estimatedTotalAmount || booking.totalAmount || 0);
              if (finalAmount > 0 && baseAmount > finalAmount) {
                discount = baseAmount - finalAmount;
                couponInfo = { code: couponCode };
              } else if (finalAmount > 0 && baseAmount !== finalAmount) {
                baseAmount = finalAmount;
              }
            }
          } else if (baseAmount > 0) {
            const finalAmount = Number(booking.estimatedTotalAmount || booking.totalAmount || 0);
            if (finalAmount > 0 && baseAmount > finalAmount) {
              discount = baseAmount - finalAmount;
              couponInfo = { code: couponCode };
            }
          }
        }
      }

      let specialRequestsHtml = '';
      if (booking.specialRequests) {
        try {
          const parsed = JSON.parse(booking.specialRequests);
          if (typeof parsed === 'object' && parsed !== null) {
            specialRequestsHtml = Object.entries(parsed).map(([key, value]) => {
              if (key === 'couponCode') return '';
              const labels = {
                guestName: 'Họ tên', guestEmail: 'Email', guestPhone: 'Số điện thoại',
                nationality: 'Quốc tịch', idCard: 'CMND/CCCD', passport: 'Hộ chiếu',
                address: 'Địa chỉ', arrivalTime: 'Giờ đến', flightNumber: 'Số chuyến bay',
                paymentMethod: 'Phương thức thanh toán', note: 'Ghi chú'
              };
              return `<div style="margin-bottom:8px"><strong>${labels[key] || key}:</strong> ${value || '-'}</div>`;
            }).join('');
          } else {
            specialRequestsHtml = booking.specialRequests;
          }
        } catch (_) {
          specialRequestsHtml = booking.specialRequests;
        }
      }

      let priceBreakdownHtml = '';
      if (couponInfo && discount > 0 && baseAmount > 0) {
        priceBreakdownHtml = `
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-ticket-alt"></i></div>
          <div class="detail-content">
            <span class="detail-label">Mã giảm giá</span>
            <span class="detail-value" style="color:#8a2017">${couponCode}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-money-bill-wave"></i></div>
          <div class="detail-content">
            <span class="detail-label">Giá gốc</span>
            <span class="detail-value" style="color:#aaa;text-decoration:line-through">${vnd(baseAmount)}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-tags"></i></div>
          <div class="detail-content">
            <span class="detail-label">Giảm giá</span>
            <span class="detail-value" style="color:#16a34a">-${vnd(discount)}</span>
          </div>
        </div>
        `;
      }

      document.getElementById('bookingDetails').innerHTML = `
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-barcode"></i></div>
          <div class="detail-content">
            <span class="detail-label">Mã đặt phòng</span>
            <span class="detail-value">${bookingCode}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-info-circle"></i></div>
          <div class="detail-content">
            <span class="detail-label">Trạng thái</span>
            <span class="detail-value" style="color:#8a2017">${getStatusText(booking.status)}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-calendar-check"></i></div>
          <div class="detail-content">
            <span class="detail-label">Ngày nhận phòng</span>
            <span class="detail-value">${checkin}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-calendar-times"></i></div>
          <div class="detail-content">
            <span class="detail-label">Ngày trả phòng</span>
            <span class="detail-value">${checkout}</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-users"></i></div>
          <div class="detail-content">
            <span class="detail-label">Số khách</span>
            <span class="detail-value">${booking.numberOfGuests || '-'} khách</span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-door-open"></i></div>
          <div class="detail-content">
            <span class="detail-label">Phòng</span>
            <span class="detail-value">${roomInfo}</span>
          </div>
        </div>
        ${priceBreakdownHtml}
        <div class="detail-row">
          <div class="detail-icon"><i class="fas fa-coins"></i></div>
          <div class="detail-content">
            <span class="detail-label">${couponInfo && discount > 0 ? 'Tổng tiền sau giảm giá' : 'Tổng tiền'}</span>
            <span class="detail-value amount">${vnd(couponInfo && discount > 0 ? (baseAmount - discount) : (booking.estimatedTotalAmount || booking.totalAmount || 0))}</span>
          </div>
        </div>
        ${specialRequestsHtml ? `
        <div class="detail-row" style="flex-direction:column;align-items:flex-start;border-bottom:none">
          <div style="display:flex;align-items:center;gap:20px;width:100%;margin-bottom:15px">
            <div class="detail-icon"><i class="fas fa-file-alt"></i></div>
            <span class="detail-label" style="margin-top:10px">Thông tin & Yêu cầu</span>
          </div>
          <div class="special-requests-box" style="width:100%">
            ${specialRequestsHtml}
          </div>
        </div>
        ` : ''}
        <div class="action-buttons" id="dynActionButtons"></div>
      `;

      const actionButtons = document.getElementById('dynActionButtons');
      if (bookingId && actionButtons) {
        actionButtons.innerHTML = `
          <a href="booking-details.html?id=${bookingId}" class="taste-btn taste-btn-primary">
            <i class="fas fa-eye"></i> Xem chi tiết
          </a>
          <a href="my-bookings.html" class="taste-btn">
            <i class="fas fa-list"></i> Đặt phòng của tôi
          </a>
          <a href="index.html" class="taste-btn">
            <i class="fas fa-home"></i> Về trang chủ
          </a>
        `;
      }
    }

    function getStatusText(status) {
      const texts = {
        'Pending': 'Chờ xác nhận',
        'Confirmed': 'Đã xác nhận',
        'Paid': 'Đã thanh toán',
        'Assigned': 'Đã phân phòng',
        'CheckedIn': 'Đã nhận phòng',
        'CheckedOut': 'Đã trả phòng',
        'Cancelled': 'Đã hủy'
      };
      return texts[status] || status;
    }

    document.addEventListener('DOMContentLoaded', loadBookingDetails);
    document.addEventListener('pjax:complete', function () {
      if (document.getElementById('bookingDetails')) {
        loadBookingDetails();
      }
    });

    // Global initial load for sidebar (only runs on direct page access)
    document.addEventListener('DOMContentLoaded', async () => {
      if (document.getElementById('site-header') && !document.querySelector('#site-header .ts-sidebar')) {
        try {
          const res = await fetch(`components/header.html?_=${Date.now()}`);
          if (res.ok) document.getElementById('site-header').innerHTML = await res.text();
        } catch (e) { console.error('Error loading header', e); }
      }
    });
  </script>

  <script src="js/page-loader.js"></script>
</body>

</html>
